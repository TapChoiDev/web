<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Thanh Toán VNPAY - Store Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/user.css">
  <style>
    .bank-pill {
      background: #ffffff;
      border: 2px solid #E2E8F0;
      border-radius: 8px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      transition: all 0.2s ease;
    }
    .bank-pill:hover, .bank-pill.active {
      border-color: #005baa;
      background: #F0F9FF;
      box-shadow: 0 4px 10px rgba(0, 91, 170, 0.15);
    }
  </style>
</head>
<body style="background: #EDF2F7;">

  <div class="container" style="padding-top: 1.5rem; padding-bottom: 2rem;">
    <div id="payment-processing-content">
      <!-- Injected by PaymentDemo.initProcessing() -->
    </div>
  </div>

  <!-- Scripts with relative ../ path -->
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/payment-demo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PaymentDemo.initProcessing();
    });
  </script>
</body>
</html>
