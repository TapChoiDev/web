<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quản Lý Sản Phẩm - Store Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="index.html" class="admin-brand">
          <span>💻 Store Anh</span>
          <span class="admin-badge">ADMIN</span>
        </a>
      </div>

      <nav class="admin-nav">
        <a href="index.html" class="admin-nav-item">
          <span>📊</span>
          <span>Tổng quan</span>
        </a>
        <a href="products.html" class="admin-nav-item active">
          <span>📦</span>
          <span>Quản lý sản phẩm</span>
        </a>
        <a href="orders.html" class="admin-nav-item">
          <span>📑</span>
          <span>Quản lý đơn hàng</span>
        </a>
        <a href="users.html" class="admin-nav-item">
          <span>👥</span>
          <span>Quản lý người dùng</span>
        </a>
        <a href="reports.html" class="admin-nav-item">
          <span>📈</span>
          <span>Báo cáo & Thống kê</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="../index.html" class="btn btn-outline text-white btn-sm btn-block" style="border-color: rgba(255,255,255,0.2);">
          🏪 Xem trang bán hàng
        </a>
        <button type="button" class="btn btn-danger btn-sm btn-block" id="btn-admin-logout">
          🚪 Đăng xuất
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <button type="button" class="btn btn-outline btn-sm admin-menu-toggle" style="display:none;" onclick="document.querySelector('.admin-sidebar').classList.toggle('open')">☰</button>
          <h1 class="admin-topbar-title">Quản Lý Sản Phẩm</h1>
        </div>
        <div class="admin-topbar-actions">
          <button type="button" class="btn btn-primary" onclick="AdminController.openAddProductModal()">
            ➕ Thêm sản phẩm mới
          </button>
        </div>
      </header>

      <div class="admin-content">
        <div class="admin-table-container">
          <!-- Toolbar Filter & Search -->
          <div class="table-toolbar">
            <div class="table-search">
              <input type="text" id="admin-prod-search" class="form-control" placeholder="Tìm kiếm theo tên, SKU, hãng...">
            </div>
            <div class="table-filters">
              <select id="admin-prod-category-filter" class="form-control" style="width: auto;">
                <option value="">-- Tất cả danh mục --</option>
              </select>
            </div>
          </div>

          <!-- Products Table -->
          <div style="overflow-x: auto;">
            <table class="admin-data-table">
              <thead>
                <tr>
                  <th style="width: 60px;">Ảnh</th>
                  <th>Mã SKU</th>
                  <th>Tên Sản Phẩm</th>
                  <th>Danh Mục</th>
                  <th>Giá Bán</th>
                  <th>Tồn Kho</th>
                  <th style="width: 100px;">Thao Tác</th>
                </tr>
              </thead>
              <tbody id="admin-products-table-body">
                <!-- Rendered dynamically by AdminController.initProducts() -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Product Modal -->
  <div class="modal-overlay" id="modal-product-form">
    <div class="modal-box" style="max-width: 680px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-product-title">Thêm sản phẩm mới</h3>
        <button type="button" class="modal-close" onclick="App.closeModal('modal-product-form')">&times;</button>
      </div>
      <form id="product-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="prod-name">Tên sản phẩm <span class="required">*</span></label>
            <input type="text" id="prod-name" class="form-control" placeholder="Ví dụ: Laptop Gaming ASUS ROG Strix G16..." required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prod-sku">Mã SKU <span class="required">*</span></label>
              <input type="text" id="prod-sku" class="form-control" placeholder="LAP-NEW-01" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="prod-brand">Thương hiệu <span class="required">*</span></label>
              <input type="text" id="prod-brand" class="form-control" placeholder="ASUS, Apple, Dell, Intel..." required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prod-category">Danh mục <span class="required">*</span></label>
              <select id="prod-category" class="form-control" required>
                <option value="laptop-gaming">Laptop Gaming</option>
                <option value="laptop-van-phong">Laptop Văn Phòng</option>
                <option value="pc-gaming">PC Gaming</option>
                <option value="pc-van-phong">PC Văn Phòng</option>
                <option value="vga">Card Đồ Họa (VGA)</option>
                <option value="cpu">CPU - Bộ Vi Xử Lý</option>
                <option value="ram">Bộ Nhớ RAM</option>
                <option value="ssd">Ổ Cứng SSD / HDD</option>
                <option value="man-hinh">Màn Hình Máy Tính</option>
                <option value="phu-kien">Bàn Phím & Chuột</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="prod-stock">Số lượng tồn kho <span class="required">*</span></label>
              <input type="number" id="prod-stock" class="form-control" min="0" value="10" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prod-price">Giá bán (VND) <span class="required">*</span></label>
              <input type="number" id="prod-price" class="form-control" min="0" step="10000" placeholder="15990000" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="prod-original-price">Giá gốc niêm yết (VND)</label>
              <input type="number" id="prod-original-price" class="form-control" min="0" step="10000" placeholder="18990000">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="prod-image">URL Hình ảnh</label>
            <input type="text" id="prod-image" class="form-control" placeholder="https://images.unsplash.com/... hoặc để trống">
            <small class="form-hint">Nếu để trống, hệ thống sẽ tự động tạo ảnh minh họa công nghệ đồng bộ.</small>
          </div>

          <div class="form-group">
            <label class="form-label" for="prod-desc">Mô tả tóm tắt sản phẩm</label>
            <textarea id="prod-desc" class="form-control" rows="3" placeholder="Đặc điểm nổi bật, tản nhiệt, đối tượng phù hợp..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="App.closeModal('modal-product-form')">Hủy bỏ</button>
          <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminController.initProducts();

      document.getElementById('btn-admin-logout').addEventListener('click', () => {
        App.confirmAction('Bạn có chắc chắn muốn đăng xuất khỏi trang Quản trị?', () => {
          window.auth.logout();
          window.location.href = '../login.html';
        }, 'Đăng xuất Admin');
      });
    });
  </script>
</body>
</html>
