<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Khoản Cá Nhân - Store Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-main">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon">💻</div>
        <span>Store <span>Anh</span></span>
      </a>

      <div class="header-search">
        <form class="header-search-form" id="global-search-form">
          <input type="text" name="q" class="search-input" placeholder="Tìm kiếm Laptop, PC Gaming, RTX 4070, Màn hình..." autocomplete="off">
          <button type="submit" class="search-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Tìm</span>
          </button>
        </form>
      </div>

      <div class="header-actions">
        <div id="header-user-menu"></div>
        <a href="cart.html" class="header-action-btn" id="header-cart-btn">
          <div class="header-action-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            <span class="badge-cart-count" style="display: none;">0</span>
          </div>
          <div class="header-action-text">
            <span class="header-action-sub">Giỏ hàng</span>
            <span class="header-action-title">Thanh toán</span>
          </div>
        </a>
      </div>
    </div>
  </header>

  <!-- Profile Content -->
  <main class="container" style="padding-bottom: 3rem;">
    <div class="breadcrumb">
      <a href="index.html">Trang chủ</a>
      <span class="breadcrumb-separator">/</span>
      <span>Hồ sơ cá nhân</span>
    </div>

    <div style="display: grid; grid-template-columns: 280px 1fr; gap: 2rem; align-items: flex-start;">
      <!-- Sidebar Info Card -->
      <div class="card" style="padding: 1.75rem; text-align: center;">
        <div id="profile-avatar" style="width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 2.2rem; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: var(--shadow-md);">
          U
        </div>
        <h3 id="profile-name-display" style="font-size: 1.25rem; margin-bottom: 0.25rem;">Họ Tên</h3>
        <p id="profile-email-display" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">email@example.com</p>

        <div id="profile-role-badge" style="margin-bottom: 1.5rem;">
          <span class="badge badge-primary">Khách hàng thành viên</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem; text-align: left; border-top: 1px solid var(--border-color); padding-top: 1rem;">
          <a href="orders.html" class="btn btn-outline btn-block" style="justify-content: flex-start;">
            📦 Đơn hàng của tôi
          </a>
          <button type="button" class="btn btn-danger btn-block" id="btn-profile-logout" style="justify-content: flex-start;">
            🚪 Đăng xuất
          </button>
        </div>
      </div>

      <!-- Main Forms Column -->
      <div style="display: flex; flex-direction: column; gap: 2rem;">
        <!-- Update Info Form -->
        <div class="card" style="padding: 2rem;">
          <h3 style="font-size: 1.25rem; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color);">
            👤 Cập nhật thông tin tài khoản
          </h3>

          <form id="profile-info-form">
            <div class="form-group">
              <label class="form-label" for="prof-fullname">Họ và tên <span class="required">*</span></label>
              <input type="text" id="prof-fullname" class="form-control" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label" for="prof-email">Địa chỉ Email</label>
                <input type="email" id="prof-email" class="form-control" disabled style="background: var(--bg-subtle);">
                <small class="form-hint">Email dùng làm định danh và không thể thay đổi.</small>
              </div>

              <div class="form-group">
                <label class="form-label" for="prof-phone">Số điện thoại</label>
                <input type="tel" id="prof-phone" class="form-control" placeholder="09xxxxxxxx">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-address">Địa chỉ nhận hàng mặc định</label>
              <input type="text" id="prof-address" class="form-control" placeholder="Số nhà, tên đường, quận/huyện...">
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">
              💾 Lưu thông tin thay đổi
            </button>
          </form>
        </div>

        <!-- Change Password Form -->
        <div class="card" style="padding: 2rem;">
          <h3 style="font-size: 1.25rem; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color);">
            🔒 Đổi mật khẩu
          </h3>

          <form id="profile-password-form">
            <div class="form-group">
              <label class="form-label" for="prof-old-pass">Mật khẩu hiện tại <span class="required">*</span></label>
              <input type="password" id="prof-old-pass" class="form-control" required placeholder="Nhập mật khẩu đang dùng">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label" for="prof-new-pass">Mật khẩu mới <span class="required">*</span></label>
                <input type="password" id="prof-new-pass" class="form-control" required placeholder="Tối thiểu 6 ký tự">
              </div>

              <div class="form-group">
                <label class="form-label" for="prof-confirm-pass">Xác nhận mật khẩu mới <span class="required">*</span></label>
                <input type="password" id="prof-confirm-pass" class="form-control" required placeholder="Nhập lại mật khẩu mới">
              </div>
            </div>

            <button type="submit" class="btn btn-outline-primary" style="margin-top: 0.5rem;">
              🔑 Cập nhật mật khẩu
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 Store Anh - Bản quyền thuộc về Đồ Án Sinh Viên CNTT.</div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const isAuth = await window.auth.requireAuth('login.html');
      if (!isAuth) return;

      const user = window.auth.getCurrentUser();
      if (!user) return;

      // Display Sidebar Info
      document.getElementById('profile-name-display').textContent = user.fullName || user.username;
      document.getElementById('profile-email-display').textContent = user.email;
      document.getElementById('profile-avatar').textContent = (user.fullName || user.username || 'U').charAt(0).toUpperCase();

      if (user.role === 'admin') {
        document.getElementById('profile-role-badge').innerHTML = '<span class="badge badge-warning">⚡ Quản Trị Viên</span>';
      }

      // Populate Input fields
      document.getElementById('prof-fullname').value = user.fullName || '';
      document.getElementById('prof-email').value = user.email || '';
      document.getElementById('prof-phone').value = user.phone || '';
      document.getElementById('prof-address').value = user.address || '';

      // Update Info Form
      document.getElementById('profile-info-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('prof-fullname').value.trim();
        const phone = document.getElementById('prof-phone').value.trim();
        const address = document.getElementById('prof-address').value.trim();

        try {
          await window.auth.updateProfile({ fullName, phone, address });
          App.showToast('Cập nhật thông tin thành công!', 'success');
          document.getElementById('profile-name-display').textContent = fullName;
          document.getElementById('profile-avatar').textContent = fullName.charAt(0).toUpperCase();
        } catch (err) {
          App.showToast(err.message, 'danger');
        }
      });

      // Change Password Form
      document.getElementById('profile-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const oldPass = document.getElementById('prof-old-pass').value;
        const newPass = document.getElementById('prof-new-pass').value;
        const confirmPass = document.getElementById('prof-confirm-pass').value;

        try {
          await window.auth.changePassword(oldPass, newPass, confirmPass);
          App.showToast('Đổi mật khẩu thành công!', 'success');
          document.getElementById('profile-password-form').reset();
        } catch (err) {
          App.showToast(err.message, 'danger');
        }
      });

      // Logout handler
      document.getElementById('btn-profile-logout').addEventListener('click', () => {
        App.confirmAction('Bạn có chắc chắn muốn đăng xuất tài khoản?', async () => {
          await window.auth.logout();
          window.location.href = 'index.html';
        }, 'Đăng xuất');
      });
    });
  </script>
</body>
</html>
