<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Tài Khoản - Store Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body style="background: #F1F5F9;">

  <div class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
          <div class="brand-logo-icon">💻</div>
          <span style="color: var(--text-main);">Store <span style="color: var(--accent);">Anh</span></span>
        </a>
        <h2>Đăng nhập hệ thống</h2>
        <p>Chào mừng bạn quay trở lại với Store Anh</p>
      </div>

      <!-- Quick Fill Helper for Reviewers/Professors -->
      <div class="quick-login-pills">
        <div class="quick-login-title">⚡ Chọn tài khoản thử nghiệm nhanh (Demo):</div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button type="button" class="btn btn-outline btn-sm" onclick="quickFill('customer')">
            👤 Khách hàng (user1)
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="quickFill('admin')">
            ⚡ Quản trị viên (admin)
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">Email hoặc Tên đăng nhập <span class="required">*</span></label>
          <input type="text" id="login-identifier" class="form-control" placeholder="admin hoặc user1" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Mật khẩu <span class="required">*</span></label>
            <a href="#" style="font-size: 0.8rem; color: var(--accent);" onclick="alert('Đây là bản demo sinh viên. Vui lòng dùng mật khẩu 123456 cho khách hàng hoặc admin123 cho admin.')">Quên mật khẩu?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu của bạn" required>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.25rem;">
          Đăng nhập ngay
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-body);">
        Chưa có tài khoản? <a href="register.html" style="color: var(--accent); font-weight: 600;">Đăng ký thành viên mới</a>
      </div>

      <div style="text-align: center; margin-top: 1rem;">
        <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Quay lại trang chủ</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function quickFill(role) {
      if (role === 'admin') {
        document.getElementById('login-identifier').value = 'admin';
        document.getElementById('login-password').value = 'admin123';
      } else {
        document.getElementById('login-identifier').value = 'khachhang@gmail.com';
        document.getElementById('login-password').value = '123456';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');

      try {
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Đang đăng nhập...';
        }
        const user = await window.auth.login(identifier, password);
        App.showToast(`Đăng nhập thành công! Xin chào ${user.fullName}`, 'success');

        setTimeout(() => {
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect');
          if (redirect) {
            window.location.href = decodeURIComponent(redirect);
          } else if (user.role === 'admin') {
            window.location.href = 'admin/index.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 800);
      } catch (err) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Đăng nhập';
        }
        App.showToast(err.message || 'Đăng nhập không thành công', 'danger', 'Đăng nhập thất bại');
      }
    });
  </script>
</body>
</html>
